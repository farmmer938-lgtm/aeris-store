name: refresh-catalog
on:
  schedule: [{cron: "17 1 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Rebuild catalogue from live storefront
        run: |
          python3 scripts/refresh_catalog.py
          node af-studio-m938-2/build_catalog.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "af-bot"
          git config user.email "af-bot@users.noreply.github.com"
          git add -A
          git commit -m "catalog: auto-refresh from live Do.ink storefront"
          git push
